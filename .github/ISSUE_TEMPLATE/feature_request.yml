name: Feature request
description: Suggest an idea for the indexer
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd like it to work (CLI, MCP tool signature, config option — whatever fits).
    validations:
      required: false